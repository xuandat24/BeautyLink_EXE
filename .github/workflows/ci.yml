name: CI

on:
  push:
    branches: [main, release/resend-backend-safe, fix/completed-booking-reviews]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - name: Build backend Docker image
        run: docker build -t beautylink-backend-review-fix .

  booking-review-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-review-password
          MYSQL_DATABASE: beautylink_review_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      REVIEW_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:3306/beautylink_review_test
      REVIEW_TEST_DRIVER: com.mysql.cj.jdbc.Driver
      REVIEW_TEST_USERNAME: root
      REVIEW_TEST_PASSWORD: ci-only-review-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -Dtest=BookingReviewReleaseTest verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
