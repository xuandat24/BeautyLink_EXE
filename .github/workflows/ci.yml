name: CI

on:
  push:
    branches: [main, release/resend-backend-safe, fix/completed-booking-reviews]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        with:
          name: checkout-backend-performance
          path: backend/target/payos-*-performance*.json
      - name: Build backend Docker image
        run: docker build -t beautylink-backend-review-fix .

  booking-review-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-review-password
          MYSQL_DATABASE: beautylink_review_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      REVIEW_TEST_JDBC_URL: jdbc:mysql://127.0.0.1:3306/beautylink_review_test
      REVIEW_TEST_DRIVER: com.mysql.cj.jdbc.Driver
      REVIEW_TEST_USERNAME: root
      REVIEW_TEST_PASSWORD: ci-only-review-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -Dtest=BookingReviewReleaseTest,PaymentCancellationSafetyTest,GoogleSigninMigrationTest,WorkforceMigrationTest,AuthenticationSessionMigrationTest,CustomerAvatarMigrationTest,PayOSQrMigrationTest,CheckoutPerformanceIntegrationTest,AdminDashboardV2IntegrationTest,AdminProfileConcurrencyTest,CommunityIntegrationTest,CommunityMigrationTest verify
      - uses: actions/upload-artifact@v4
        with:
          name: checkout-mysql-performance
          path: backend/target/payos-jdbc-performance-MySQL8.4.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  booking-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Prepare isolated test server and browser runtime
        run: |
          cd backend
          mvn --batch-mode --no-transfer-progress test-compile dependency:build-classpath -Dmdep.outputFile=target/test-classpath.txt -Dmdep.includeScope=test
          npm install --prefix "$RUNNER_TEMP/beautylink-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/beautylink-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Browser to real Spring and isolated H2, test-classpath fake gateway only
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/beautylink-browser/node_modules/playwright
        run: |
          java -cp "backend/target/test-classes:backend/target/classes:$(cat backend/target/test-classpath.txt)" com.example.backend.BookingReviewSmokeServer > backend/target/browser-server.log 2>&1 &
          backend_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js --host=127.0.0.1 --strictPort) > backend/target/browser-vite.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if grep -q BOOKING_REVIEW_SMOKE_READY backend/target/browser-server.log && curl --fail --silent http://localhost:5173/tests/review-smoke.html > /dev/null; then break; fi
            sleep 1
          done
          grep -q BOOKING_REVIEW_SMOKE_READY backend/target/browser-server.log
          node frontend/tests/chatWidgetSmoke.mjs
          node frontend/tests/bookingReviewSmoke.mjs
          node frontend/tests/checkoutEntrySmoke.mjs
          node frontend/tests/authMobileSmoke.mjs
          node frontend/tests/adminDashboardSmoke.mjs
      - name: Report deposits and booking calendar reconciliation on desktop and mobile
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/beautylink-browser/node_modules/playwright
          SMOKE_REPORT_PAYMENTS: '1'
        run: |
          java -cp "backend/target/test-classes:backend/target/classes:$(cat backend/target/test-classpath.txt)" com.example.backend.BookingReviewSmokeServer > backend/target/report-payments-server.log 2>&1 &
          backend_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js --host=127.0.0.1 --strictPort) > backend/target/report-payments-vite.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if grep -q BOOKING_REVIEW_SMOKE_READY backend/target/report-payments-server.log && curl --fail --silent http://localhost:5173 > /dev/null; then break; fi
            sleep 1
          done
          grep -q BOOKING_REVIEW_SMOKE_READY backend/target/report-payments-server.log
          node frontend/tests/reportingPaymentSmoke.mjs
      - name: Checkout performance and two-context race (isolated fake provider)
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/beautylink-browser/node_modules/playwright
          SMOKE_PERF_MODE: '1'
          PERF_LABEL: after
          PERF_SAMPLES: '30'
        run: |
          java -cp "backend/target/test-classes:backend/target/classes:$(cat backend/target/test-classpath.txt)" com.example.backend.BookingReviewSmokeServer > backend/target/perf-ci-server.log 2>&1 &
          backend_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js --host=127.0.0.1 --strictPort) > backend/target/perf-ci-vite.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if grep -q BOOKING_REVIEW_SMOKE_READY backend/target/perf-ci-server.log && curl --fail --silent http://localhost:5173/tests/payos-performance.html > /dev/null; then break; fi
            sleep 1
          done
          grep -q BOOKING_REVIEW_SMOKE_READY backend/target/perf-ci-server.log
          node frontend/tests/payosPerformance.mjs
          node frontend/tests/payosConcurrencySmoke.mjs
      - name: Community browser, persistence and server-served social metadata
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/beautylink-browser/node_modules/playwright
        run: |
          (cd frontend && npm run build)
          java -cp "backend/target/test-classes:backend/target/classes:$(cat backend/target/test-classpath.txt)" com.example.backend.service.CommunitySmokeServer > backend/target/community-server.log 2>&1 &
          backend_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js --host=127.0.0.1 --strictPort) > backend/target/community-vite.log 2>&1 &
          frontend_pid=$!
          (cd frontend && exec env COMMUNITY_SMOKE=1 node --import tsx tests/communityShareServer.ts) > backend/target/community-share-server.log 2>&1 &
          share_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" "$share_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if grep -q COMMUNITY_SMOKE_READY backend/target/community-server.log && grep -q COMMUNITY_SHARE_READY backend/target/community-share-server.log && curl --fail --silent http://localhost:5173/community > /dev/null; then break; fi
            sleep 1
          done
          grep -q COMMUNITY_SMOKE_READY backend/target/community-server.log
          node frontend/tests/communitySmoke.mjs
      - name: Admin display profiles, A–Z and ordinals (isolated fixtures only)
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/beautylink-browser/node_modules/playwright
          SMOKE_DISPLAY_PROFILES: '1'
        run: |
          java -cp "backend/target/test-classes:backend/target/classes:$(cat backend/target/test-classpath.txt)" com.example.backend.BookingReviewSmokeServer > backend/target/display-browser-server.log 2>&1 &
          backend_pid=$!
          (cd frontend && exec node node_modules/vite/bin/vite.js --host=127.0.0.1 --strictPort) > backend/target/display-browser-vite.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if grep -q BOOKING_REVIEW_SMOKE_READY backend/target/display-browser-server.log && curl --fail --silent http://localhost:5173 > /dev/null; then break; fi
            sleep 1
          done
          grep -q BOOKING_REVIEW_SMOKE_READY backend/target/display-browser-server.log
          node frontend/tests/adminDisplayProfilesSmoke.mjs
      - name: Admin V2 screenshots and isolated browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-v2-browser
          path: |
            backend/target/admin-display-*.png
            backend/target/display-browser-server.log
            backend/target/admin-v2-*.png
            backend/target/report-payments-*.png
            backend/target/report-payments-server.log
            backend/target/payos-qr-*.png
            backend/target/review-midpoint-*.png
            backend/target/payos-preparation-*.png
            backend/target/checkout-shared-*.png
            backend/target/booking-history-*.png
            backend/target/payos-performance-*.json
            backend/target/payos-concurrency-smoke.json
            backend/target/payos-concurrency-failure-*.png
            backend/target/perf-ci-server.log
            backend/target/browser-server.log
            backend/target/browser-vite.log
            backend/target/community-*.png
            backend/target/community-browser-results.json
            backend/target/community-server.log
            backend/target/community-vite.log
            backend/target/community-share-server.log
