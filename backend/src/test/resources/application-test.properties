spring.datasource.url=jdbc:h2:mem:beautylink;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=beautylink-test-secret-that-is-long-enough-for-hmac-sha256
app.jwt.expiration-ms=3600000
app.kyc.encryption-key=beautylink-test-kyc-key-that-is-long-enough-for-aes-256
app.cors.allowed-origins=http://localhost:5173
app.supplier.auto-verify=true
debug=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.web=INFO
