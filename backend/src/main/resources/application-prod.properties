app.supplier.auto-verify=${SUPPLIER_AUTO_VERIFY:false}
app.kyc.encryption-key=${KYC_ENCRYPTION_KEY}
# Demo accounts and catalog are deliberately unavailable in production. The
# seeders are also profile-gated so an accidental environment variable cannot
# create or overwrite demonstration identities in the live database.
app.demo-data.enabled=false
server.forward-headers-strategy=framework
# Railway terminates public TLS and supplies X-Real-IP. This profile is only
# used behind that trusted edge; local/default profiles never trust this header.
app.network.trust-proxy-client-ip=${TRUST_PROXY_CLIENT_IP:true}
# A single Railway replica can safely retain the in-memory limiter. Set
# RATE_LIMIT_BACKEND=redis only after REDIS_URL points at a provisioned shared
# Redis service, which is required before scaling to multiple replicas.
app.security.rate-limit.backend=${RATE_LIMIT_BACKEND:memory}
