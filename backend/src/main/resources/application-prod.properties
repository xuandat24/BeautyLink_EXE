app.supplier.auto-verify=${SUPPLIER_AUTO_VERIFY:false}
app.kyc.encryption-key=${KYC_ENCRYPTION_KEY}
# Demo accounts and catalog are deliberately unavailable in production. The
# seeders are also profile-gated so an accidental environment variable cannot
# create or overwrite demonstration identities in the live database.
app.demo-data.enabled=false
server.forward-headers-strategy=framework
app.security.rate-limit.backend=${RATE_LIMIT_BACKEND:redis}
