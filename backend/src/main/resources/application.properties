spring.application.name=beautylink-backend
server.port=${PORT:8080}
spring.config.import=optional:file:.env.properties
spring.datasource.url=${MYSQL_JDBC_URL:${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:beautylink}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8}}
spring.datasource.username=${MYSQL_USERNAME:${MYSQLUSER:}}
spring.datasource.password=${MYSQL_PASSWORD:${MYSQLPASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok
spring.jackson.time-zone=Asia/Bangkok
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.kyc.encryption-key=${KYC_ENCRYPTION_KEY}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.supplier.auto-verify=${SUPPLIER_AUTO_VERIFY:true}
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
app.demo-data.password=${DEMO_ACCOUNT_PASSWORD:}
app.security.login.max-per-identifier=${LOGIN_MAX_PER_IDENTIFIER:8}
app.security.login.max-per-ip=${LOGIN_MAX_PER_IP:20}
app.security.login.window-seconds=${LOGIN_RATE_WINDOW_SECONDS:900}
app.security.registration.max-per-ip=${REGISTRATION_MAX_PER_IP:5}
app.security.registration.window-seconds=${REGISTRATION_RATE_WINDOW_SECONDS:3600}
app.security.verification.max-per-target=${OTP_MAX_SENDS_PER_TARGET:5}
app.security.verification.window-seconds=${OTP_SEND_WINDOW_SECONDS:3600}
app.security.rate-limit.backend=${RATE_LIMIT_BACKEND:memory}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false
app.otp.pepper=${OTP_PEPPER}
app.otp.code-ttl-seconds=${OTP_CODE_TTL_SECONDS:600}
app.otp.registration-token-ttl-seconds=${OTP_REGISTRATION_TOKEN_TTL_SECONDS:900}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.mail-from=${OTP_MAIL_FROM:}
app.otp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.otp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.otp.twilio.from-number=${TWILIO_FROM_NUMBER:}
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/?payment=success}
app.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/?payment=cancelled}
app.payos.webhook-url=${PAYOS_WEBHOOK_URL:}
app.payos.reconciliation-ms=${PAYOS_RECONCILIATION_MS:60000}
app.payos.reconciliation-initial-delay-ms=${PAYOS_RECONCILIATION_INITIAL_DELAY_MS:60000}
